[package]
name = "oneroll"
version = "1.3.4"
edition = "2021"
description = "A fast dice-expression parser and evaluator powered by Rust, Python, and PEG grammar."
license = "AGPL-3.0"
documentation = "https://oneroll.hydroroll.team/"
homepage = "https://oneroll.hydroroll.team/"
repository = "https://github.com/HydroRoll-Team/OneRoll"
authors = ["HsiangNianian"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
getrandom = "0.3.4"
pest = "2.8.1"
pest_derive = "2.8.1"
pyo3 = { version = "0.19.2", features = ["abi3-py39"] }
rand_chacha = "0.9.0"
rand_core = "0.9.5"
time = { version = "0.3.36", features = ["formatting", "macros", "local-offset"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[dev-dependencies]
proptest = "1.11.0"
