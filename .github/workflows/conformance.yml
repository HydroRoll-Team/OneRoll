name: V1 Conformance

on:
  push:
    branches:
      - main
      - dev
    paths:
      - Cargo.toml
      - pyproject.toml
      - src/**
      - tests/conformance/**
      - tests/test_v1_conformance.py
      - uv.lock
      - .github/workflows/conformance.yml
  pull_request:
    paths:
      - Cargo.toml
      - pyproject.toml
      - src/**
      - tests/conformance/**
      - tests/test_v1_conformance.py
      - uv.lock
      - .github/workflows/conformance.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install project
        run: uv sync --frozen

      - name: Verify Rust corpus
        run: cargo test rust_engine_matches_v1_conformance_corpus

      - name: Verify Python corpus
        run: uv run --frozen python -m unittest tests.test_v1_conformance -v
